# Construit et publie l'image sur GHCR :
# - chaque jour, seulement si une nouvelle version de Stash est sortie ;
# - le 1er de chaque mois, pour intégrer les mises à jour de sécurité Debian ;
# - à chaque modification du Dockerfile, ou à la demande (bouton "Run workflow").
name: build

on:
  schedule:
    - cron: "17 4 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Dernière version de Stash
        id: version
        run: |
          tag=$(curl -fsSL https://api.github.com/repos/stashapp/stash/releases/latest | jq -re .tag_name)
          echo "stash=${tag#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Faut-il construire ?
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%d)" = "01" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${{ steps.version.outputs.image }}:v${{ steps.version.outputs.stash }}" > /dev/null 2>&1; then
            echo "Image v${{ steps.version.outputs.stash }} déjà publiée, rien à faire."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.build == 'true'

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.build == 'true'

      - name: Construction et publication
        if: steps.check.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          build-args: STASH_VERSION=${{ steps.version.outputs.stash }}
          tags: |
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:v${{ steps.version.outputs.stash }}
